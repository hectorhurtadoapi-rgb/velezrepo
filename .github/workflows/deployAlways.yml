name: 🚀 Tarea de Despliegue

on:
   push:
     branches:
       - main

jobs:
  deploy:
    name: 🎉 Trabajo de Despliegue
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obteniendo el código más reciente
        uses: actions/checkout@v4

      - name: 📂 Sincronizando archivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: FTP_RUTA # Change if using another host
          username: FTP_USUARIO
          password: FTP_CLAVE
          server-dir: FTP_CARPETA/ # Replace with your correct path
          protocol: ftps
          timeout: 86400000
          log-level: standard
          exclude: |
           .git/**
           .github/**
