<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo en HTML</title>

    <style>
        .logo-container {
            text-align: center;       /* Centra el logo */
            margin-top: 40px;
        }

        .logo {
            width: 180px;             /* Tamaño del logo */
            height: auto;             /* Mantiene proporción */
        }
    </style>
</head>

<body>

    <div class="logo-container">
        <img src="ruta-del-logo.png" alt="Logo" class="logo">
    </div>

</body>
</html>
